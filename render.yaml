# Render deployment config.
# OPENAI_API_KEY is intentionally NOT stored here — set it in the Render
# dashboard so the key never lands in the repository.
services:
  - type: web
    name: medagent
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker keeps the in-memory rate limiter accurate and fits the
    # free tier's memory budget. The long timeout allows for multi-step
    # agent loops that make several OpenAI calls.
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 180
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DEMO_MODE
        value: "true"
      - key: SEED_ON_BOOT
        value: "90"
      - key: RATE_LIMIT_PER_HOUR
        value: "30"
      - key: OPENAI_API_KEY
        sync: false   # set manually in the dashboard
